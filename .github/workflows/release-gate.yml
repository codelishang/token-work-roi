name: release-gate

on:
  pull_request:
    branches:
      - main
      - test
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: ubuntu-latest / Node 24.x
    if: "github.event_name != 'push' || github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'chore: refresh official model pricing'"
    runs-on: ubuntu-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci --registry=https://registry.npmmirror.com

      - run: npm test

      - run: npm run typecheck:tools

      - run: node src/cli.ts privacy-check --include-untracked

      - run: npm run build

      - run: npm run privacy:check

      - run: npm audit --audit-level=low --registry=https://registry.npmjs.org

      - name: Install Chrome for browser smoke
        uses: browser-actions/setup-chrome@v1

      - run: npm run smoke:browser

      - run: npm run desktop:smoke

      - run: git diff --check

  package-smoke:
    name: ${{ matrix.os }} / Node 24.x
    if: "github.event_name != 'push' || github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'chore: refresh official model pricing'"
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      # Keep the installed-package check fast without changing the production 60s default.
      TOKEN_WORK_LIVE_COLLECT_INTERVAL_SECONDS: '30'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci --registry=https://registry.npmmirror.com

      - run: npm run smoke:npx

      - run: npm run desktop:smoke
