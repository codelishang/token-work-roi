name: update-pricing

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to refresh
        required: false
        default: main
        type: choice
        options:
          - main
          - test
  schedule:
    # GitHub cron uses UTC; this is Monday 00:01 in Asia/Shanghai.
    - cron: '1 16 * * 0'

permissions:
  contents: write

jobs:
  update-pricing:
    name: Refresh official model pricing (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main","test"]') || fromJSON(format('["{0}"]', inputs.target_branch || 'main')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci --registry=https://registry.npmmirror.com
      - run: npm run typecheck:tools

      - name: Refresh official pricing
        run: npm run pricing:update

      - run: npm test

      - run: npm run build

      - run: git diff --check

      - name: Commit pricing updates
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh official model pricing"
          file_pattern: "src/pricing.ts data/official-pricing.json"
