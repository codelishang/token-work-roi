name: update-pricing

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to refresh
        required: false
        default: main
        type: choice
        options:
          - main
          - test
  schedule:
    # GitHub cron uses UTC; this is Tuesday 01:15 in Asia/Shanghai.
    - cron: '15 17 * * 1'

permissions:
  contents: write

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update-pricing-main:
    name: Refresh official model pricing (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.target_branch == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci --registry=https://registry.npmmirror.com
      - name: Refresh official pricing
        run: npm run pricing:update

      - run: npm run typecheck:tools
      - run: npm run test:pricing

      - run: npm run build

      - run: git diff --check

      - name: Commit pricing updates
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh official model pricing"
          file_pattern: "src/pricing.ts data/official-pricing.json"

  update-pricing-test:
    name: Refresh official model pricing (test)
    needs: update-pricing-main
    if: >-
      always() &&
      ((github.event_name == 'schedule' && needs.update-pricing-main.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target_branch == 'test'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Fetch pricing committed on main
        if: github.event_name == 'schedule'
        run: git fetch origin main --depth=1

      - name: Use the pricing files and regression test verified on main
        if: github.event_name == 'schedule'
        run: git checkout FETCH_HEAD -- src/pricing.ts data/official-pricing.json test/official-pricing.test.ts

      - run: npm ci --registry=https://registry.npmmirror.com
      - name: Refresh official pricing
        if: github.event_name == 'workflow_dispatch'
        run: npm run pricing:update

      - run: npm run typecheck:tools
      - run: npm run test:pricing

      - run: npm run build

      - run: git diff --check

      - name: Commit pricing updates
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh official model pricing"
          file_pattern: "src/pricing.ts data/official-pricing.json"
